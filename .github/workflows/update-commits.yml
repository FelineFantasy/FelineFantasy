name: Update commit count

on:
  schedule:
    # Every Monday at 04:00 UTC — weekly is enough, daily only added noise
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-commit-count
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          QUERY='query { user(login: "FelineFantasy") { contributionsCollection { totalCommitContributions } } }'
          COMMITS=$(gh api graphql -f query="$QUERY" \
            --jq '.data.user.contributionsCollection.totalCommitContributions')

          if [ -z "$COMMITS" ] || [ "$COMMITS" = "null" ]; then
            echo "Error: failed to fetch the commit count from the GitHub API" >&2
            exit 1
          fi

          ROUNDED=$(( (COMMITS / 10) * 10 ))
          echo "Commits: $COMMITS, shown as: $ROUNDED+"
          echo "ROUNDED=$ROUNDED" >> "$GITHUB_ENV"

      - name: Update README
        run: |
          set -euo pipefail

          sed -i -E \
            "s|<!-- commits:start -->.*<!-- commits:end -->|<!-- commits:start -->📦 **${ROUNDED}+ commits** in the last year<!-- commits:end -->|" \
            README.md

          grep -q "<!-- commits:start -->" README.md || {
            echo "Error: commit markers not found in README.md" >&2
            exit 1
          }

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "docs: update commit count to ${ROUNDED}+"
          git push
