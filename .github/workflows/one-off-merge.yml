name: One-off merge of PR #1

# Temporary workflow: merges PR #1 on 26 Oct 2026 and then deletes itself.
on:
  schedule:
    # 26 Oct, 04:30 UTC = 09:30 UTC+5
    - cron: '30 4 26 10 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: one-off-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check the date
        id: gate
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          echo "Today (UTC): $TODAY"
          if [ "$TODAY" = "2026-10-26" ] || [ "$TODAY" = "2026-10-27" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the target date, nothing to do."
          fi

      - name: Merge PR #1
        id: merge
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          STATE=$(gh pr view 1 --repo "$REPO" --json state --jq '.state')
          echo "PR #1 state: $STATE"

          case "$STATE" in
            OPEN)
              gh pr merge 1 --repo "$REPO" --squash --delete-branch
              echo "Merged PR #1 into main."
              echo "done=true" >> "$GITHUB_OUTPUT"
              ;;
            MERGED|CLOSED)
              echo "PR #1 is already $STATE — nothing to merge."
              echo "done=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected state: $STATE" >&2
              exit 1
              ;;
          esac

      - name: Re-enable the commit counter workflow
        if: steps.gate.outputs.run == 'true'
        run: gh workflow enable update-commits.yml --repo "$REPO" || true

      - name: Remove this one-off workflow
        if: steps.merge.outputs.done == 'true'
        run: |
          set -euo pipefail
          PATH_IN_REPO=".github/workflows/one-off-merge.yml"
          SHA=$(gh api "repos/$REPO/contents/$PATH_IN_REPO" --jq '.sha')
          gh api -X DELETE "repos/$REPO/contents/$PATH_IN_REPO" \
            -f message="chore: remove one-off merge workflow" \
            -f sha="$SHA"
          echo "Scheduler removed. Bye 🐾"
